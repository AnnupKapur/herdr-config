id = "sidebar-numbers"
name = "Sidebar Numbers"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Expose each agent's and workspace's 1-based sidebar position as the $idx token for expanded sidebar rows"
platforms = ["macos", "linux"]

[[startup]]
command = ["python3", "sidebar-numbers.py"]

[[events]]
on = "pane.created"
command = ["python3", "sidebar-numbers.py"]

[[events]]
on = "pane.closed"
command = ["python3", "sidebar-numbers.py"]

[[events]]
on = "pane.exited"
command = ["python3", "sidebar-numbers.py"]

[[events]]
on = "pane.moved"
command = ["python3", "sidebar-numbers.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "sidebar-numbers.py"]

[[events]]
on = "workspace.created"
command = ["python3", "sidebar-numbers.py"]

[[events]]
on = "workspace.closed"
command = ["python3", "sidebar-numbers.py"]

[[events]]
on = "workspace.moved"
command = ["python3", "sidebar-numbers.py"]

[[events]]
on = "workspace.reordered"
command = ["python3", "sidebar-numbers.py"]

[[events]]
on = "tab.moved"
command = ["python3", "sidebar-numbers.py"]

[[events]]
on = "tab.closed"
command = ["python3", "sidebar-numbers.py"]

[[events]]
on = "workspace.renamed"
command = ["python3", "sidebar-numbers.py"]

[[actions]]
id = "sync"
title = "Sync sidebar numbers"
description = "Renumber agents and workspaces in the sidebar"
contexts = ["global", "workspace", "tab"]
command = ["python3", "sidebar-numbers.py"]
